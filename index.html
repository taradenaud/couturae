<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couturae - Fashion Week News & Data Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid #222;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            letter-spacing: 2px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: #111;
            border: 1px solid #222;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: #444;
            transform: translateY(-2px);
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section {
            background: #111;
            border: 1px solid #222;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
            letter-spacing: 2px;
        }
        
        .buzzword-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .buzzword-item {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 15px;
            text-align: center;
        }
        
        .buzzword-word {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .buzzword-count {
            font-size: 24px;
            font-weight: 600;
            color: #666;
        }
        
        .designer-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .designer-item {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .designer-item:hover {
            border-color: #444;
            background: #151515;
        }
        
        .designer-name {
            font-size: 16px;
            font-weight: 500;
        }
        
        .designer-shows {
            font-size: 20px;
            color: #666;
        }
        
        .designer-meta {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #2a0000;
            border: 1px solid #440000;
            padding: 20px;
            margin-bottom: 20px;
            color: #ff6666;
        }
        
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #111;
            border: 1px solid #222;
        }
        
        .filter-bar label {
            font-size: 12px;
            letter-spacing: 2px;
            color: #888;
        }
        
        .filter-bar select {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            min-width: 180px;
        }
        
        .filter-bar select:hover {
            border-color: #555;
        }
        
        .filter-bar select:focus {
            outline: none;
            border-color: #666;
        }
        
        .filter-bar select option {
            background: #111;
            color: #fff;
        }
        
        .current-season {
            margin-left: auto;
            font-size: 12px;
            color: #666;
            letter-spacing: 1px;
        }
        
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
        }
        
        .modal-overlay.active {
            display: block;
        }
        
        .modal {
            max-width: 900px;
            margin: 0 auto;
            background: #111;
            border: 1px solid #333;
            position: relative;
        }
        
        .modal-header {
            padding: 40px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .modal-header h2 {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0;
        }
        
        .modal-header .designer-stats {
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }
        
        .modal-header .stat {
            text-align: center;
        }
        
        .modal-header .stat-value {
            font-size: 24px;
            font-weight: 600;
        }
        
        .modal-header .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .modal-close {
            background: none;
            border: 1px solid #333;
            color: #888;
            font-size: 24px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-close:hover {
            border-color: #666;
            color: #fff;
        }
        
        .modal-body {
            padding: 30px 40px 40px;
        }
        
        .shows-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .show-item {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 25px;
            transition: all 0.3s;
        }
        
        .show-item:hover {
            border-color: #444;
            background: #151515;
        }
        
        .show-item a {
            color: #fff;
            text-decoration: none;
        }
        
        .show-item a:hover {
            text-decoration: underline;
        }
        
        .show-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .show-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        
        .show-meta span {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .show-meta .tag {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 4px 10px;
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        .show-snippet {
            font-size: 13px;
            color: #888;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .no-shows {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .cities-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .city-tag {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 6px 12px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>COUTURAE</h1>
            <div class="subtitle">FASHION WEEK NEWS & DATA PLATFORM</div>
        </header>
        
        <div id="error-container"></div>
        
        <!-- Designer Modal -->
        <div id="designer-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <div>
                        <h2 id="modal-designer-name"></h2>
                        <div class="designer-stats">
                            <div class="stat">
                                <div class="stat-value" id="modal-show-count">0</div>
                                <div class="stat-label">Articles</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value" id="modal-city-count">0</div>
                                <div class="stat-label">Cities</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value" id="modal-season-count">0</div>
                                <div class="stat-label">Seasons</div>
                            </div>
                        </div>
                        <div id="modal-cities-tags" class="cities-tags"></div>
                    </div>
                    <button class="modal-close" onclick="closeDesignerModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="modal-shows-list" class="shows-list">
                        <div class="loading">Loading shows...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="filter-bar">
            <label for="season-select">SEASON</label>
            <select id="season-select">
                <option value="all">All Seasons</option>
            </select>
        </div>
        
        <div id="stats-container" class="stats-grid">
            <div class="loading">Loading statistics...</div>
        </div>
        
        <div class="section">
            <div class="section-title">TRENDING BUZZWORDS</div>
            <div id="buzzwords-container" class="buzzword-grid">
                <div class="loading">Loading buzzwords...</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">DESIGNERS & SHOWS</div>
            <div id="designers-container" class="designer-list">
                <div class="loading">Loading designers...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentSeason = 'all';
        
        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error"> ${message}</div>`;
        }
        
        function getSeasonParam() {
            return currentSeason !== 'all' ? `season=${currentSeason}` : '';
        }
        
        async function fetchSeasons() {
            try {
                const response = await fetch(`${API_BASE}/seasons`);
                const data = await response.json();
                
                const select = document.getElementById('season-select');
                // Keep "All Seasons" option and add the rest
                const options = data.map(item => 
                    `<option value="${item.season}">${formatSeasonName(item.season)} (${item.article_count} articles)</option>`
                ).join('');
                
                select.innerHTML = `<option value="all">All Seasons</option>${options}`;
            } catch (error) {
                console.error('Failed to load seasons:', error);
            }
        }
        
        function formatSeasonName(season) {
            if (!season) return 'Unknown';
            // Convert FW24 to "Fall/Winter 2024", SS25 to "Spring/Summer 2025"
            const match = season.match(/^(FW|SS)(\d{2})$/i);
            if (match) {
                const type = match[1].toUpperCase() === 'FW' ? 'Fall/Winter' : 'Spring/Summer';
                const year = parseInt(match[2]) > 50 ? `19${match[2]}` : `20${match[2]}`;
                return `${type} ${year}`;
            }
            return season;
        }
        
        async function fetchStats() {
            try {
                const seasonParam = getSeasonParam();
                const url = `${API_BASE}/stats${seasonParam ? '?' + seasonParam : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const seasonLabel = currentSeason !== 'all' 
                    ? `<div class="stat-card"><div class="stat-value">${formatSeasonName(currentSeason)}</div><div class="stat-label">Selected Season</div></div>` 
                    : '';
                
                const statsHTML = `
                    ${seasonLabel}
                    <div class="stat-card">
                        <div class="stat-value">${data.total_articles}</div>
                        <div class="stat-label">Articles</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.unique_buzzwords}</div>
                        <div class="stat-label">Unique Buzzwords</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.total_buzzword_mentions}</div>
                        <div class="stat-label">Total Buzzword Mentions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.unique_designers}</div>
                        <div class="stat-label">Designers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.total_designer_mentions}</div>
                        <div class="stat-label">Designer Mentions</div>
                    </div>
                `;
                
                document.getElementById('stats-container').innerHTML = statsHTML;
            } catch (error) {
                showError('Failed to load statistics. Make sure the API is running on http://localhost:3000');
                document.getElementById('stats-container').innerHTML = '<div class="loading">Failed to load</div>';
            }
        }
        
        async function fetchBuzzwords() {
            try {
                const seasonParam = getSeasonParam();
                const url = `${API_BASE}/buzzwords/trending?limit=20${seasonParam ? '&' + seasonParam : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const buzzwordsHTML = data.map(item => `
                    <div class="buzzword-item">
                        <div class="buzzword-word">${item.word}</div>
                        <div class="buzzword-count">${item.frequency}</div>
                    </div>
                `).join('');
                
                document.getElementById('buzzwords-container').innerHTML = buzzwordsHTML || '<div class="loading">No buzzwords found</div>';
            } catch (error) {
                document.getElementById('buzzwords-container').innerHTML = '<div class="loading">Failed to load</div>';
            }
        }
        
        async function fetchDesigners() {
            try {
                const seasonParam = getSeasonParam();
                const url = `${API_BASE}/designers${seasonParam ? '?' + seasonParam : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const designersHTML = data.map(item => `
                    <div class="designer-item" onclick="openDesignerModal('${item.designer_name.replace(/'/g, "\\'")}', ${item.total_shows}, ${item.cities}, ${item.seasons}, '${(item.cities_list || []).join(',')}')">
                        <div>
                            <div class="designer-name">${item.designer_name}</div>
                            <div class="designer-meta">${item.cities} cities • ${item.seasons} seasons</div>
                        </div>
                        <div class="designer-shows">${item.total_shows}</div>
                    </div>
                `).join('');
                
                document.getElementById('designers-container').innerHTML = designersHTML || '<div class="loading">No designers found</div>';
            } catch (error) {
                document.getElementById('designers-container').innerHTML = '<div class="loading">Failed to load</div>';
            }
        }
        
        function refreshDashboard() {
            fetchStats();
            fetchBuzzwords();
            fetchDesigners();
        }
        
        // Season dropdown change handler
        document.getElementById('season-select').addEventListener('change', (e) => {
            currentSeason = e.target.value;
            refreshDashboard();
        });
        
        // Designer Modal Functions
        async function openDesignerModal(designerName, totalShows, cities, seasons, citiesList) {
            const modal = document.getElementById('designer-modal');
            document.getElementById('modal-designer-name').textContent = designerName;
            document.getElementById('modal-show-count').textContent = totalShows;
            document.getElementById('modal-city-count').textContent = cities;
            document.getElementById('modal-season-count').textContent = seasons;
            
            // Show city tags
            const citiesArray = citiesList ? citiesList.split(',').filter(c => c) : [];
            document.getElementById('modal-cities-tags').innerHTML = citiesArray
                .map(city => `<span class="city-tag">${city}</span>`)
                .join('');
            
            document.getElementById('modal-shows-list').innerHTML = '<div class="loading">Loading shows...</div>';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            try {
                const response = await fetch(`${API_BASE}/designers/${encodeURIComponent(designerName)}/shows`);
                const shows = await response.json();
                
                if (shows.length === 0) {
                    document.getElementById('modal-shows-list').innerHTML = '<div class="no-shows">No shows found for this designer</div>';
                    return;
                }
                
                const showsHTML = shows.map(show => `
                    <div class="show-item">
                        <div class="show-title">
                            <a href="${show.url}" target="_blank">${show.title || 'Untitled'}</a>
                        </div>
                        <div class="show-meta">
                            ${show.city ? `<span class="tag">${show.city}</span>` : ''}
                            ${show.season ? `<span class="tag">${formatSeasonName(show.season)}</span>` : ''}
                            ${show.published_at ? `<span> ${new Date(show.published_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</span>` : ''}
                        </div>
                        ${show.snippet ? `<div class="show-snippet">${show.snippet}</div>` : ''}
                    </div>
                `).join('');
                
                document.getElementById('modal-shows-list').innerHTML = showsHTML;
            } catch (error) {
                document.getElementById('modal-shows-list').innerHTML = '<div class="no-shows">Failed to load shows</div>';
            }
        }
        
        function closeDesignerModal() {
            document.getElementById('designer-modal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDesignerModal();
        });
        
        // Close modal when clicking outside
        document.getElementById('designer-modal').addEventListener('click', (e) => {
            if (e.target.id === 'designer-modal') closeDesignerModal();
        });
        
        // Initial load
        fetchSeasons();
        refreshDashboard();
        
        // Refresh data every 30 seconds
        setInterval(refreshDashboard, 30000);
    </script>
</body>
</html>
